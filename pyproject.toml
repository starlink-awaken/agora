[project]
name = "agora"
version = "0.1.0"
description = "Agora — MCP Service Convergence Hub. Route, monitor, and govern inter-service communication."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Minerva Contributors"}]
keywords = ["mcp", "service-mesh", "hub", "routing", "governance"]
dependencies = ["httpx>=0.27", "structlog>=24.0", "fastmcp>=0.1", "rich>=13.0"]

[project.scripts]
agora = "agora.cli:main"
agora-mcp = "agora.server.mcp:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
