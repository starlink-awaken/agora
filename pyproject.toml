[project]
name = "agora"
version = "0.1.1"
description = "Agora — MCP Service Convergence Hub. Route, monitor, and govern inter-service communication."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Minerva Contributors"}]
keywords = ["mcp", "service-mesh", "hub", "routing", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
]
dependencies = ["httpx>=0.27", "structlog>=24.0", "fastmcp>=0.1", "rich>=13.0", "fastapi>=0.100", "uvicorn>=0.20"]

[project.urls]
Homepage = "https://github.com/starlink-awaken/agora"
Repository = "https://github.com/starlink-awaken/agora.git"
Documentation = "https://github.com/starlink-awaken/agora#readme"
Issues = "https://github.com/starlink-awaken/agora/issues"

[project.scripts]
agora = "agora.cli:main"
agora-mcp = "agora.server.mcp:main"
agora-web = "agora.web.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.0"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
